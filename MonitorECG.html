<style>
:root{--bg:#eef0f2;--panel:#fff;--ink:#1b2530;--muted:#5d6b78;--line:#c3cbd2;--grid:#dbe3e8;
  --ok:#1f8a5b;--bad:#c2410c;--ecg:#1a7f3c;--bpm:#c026d3;--spo2:#1d6fd1;--tmp:#e07a00;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#161b21;--panel:#1f262e;--ink:#e6ebef;--muted:#8c99a5;
  --line:#34404b;--grid:#2a3b44;--ok:#4cc38a;--bad:#f08a4b;--ecg:#4cc38a;--bpm:#e879f9;--spo2:#5aa9ff;--tmp:#ffb020}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Segoe UI",system-ui,sans-serif;
  padding:max(8px,env(safe-area-inset-top)) 12px max(8px,env(safe-area-inset-bottom));
  height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:auto}
main{flex:1;min-height:0;width:100%;max-width:1300px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
button,input{font:inherit;color:var(--ink)}
button{cursor:pointer;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.bar{display:flex;gap:8px}
.bar input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);font-family:ui-monospace,Consolas,monospace}
.bar button{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.estado{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bad)}.dot.on{background:var(--ok)}
.tabs{display:flex;gap:6px}.tabs button{flex:1;font-weight:600}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pan[hidden]{display:none}.pan{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.vals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 12px}
.k{color:var(--muted);font-size:.85rem}
.v{font-size:1.7rem;line-height:1.05;font-weight:600;font-variant-numeric:tabular-nums}
.v small{font-size:1rem;font-weight:400;color:var(--muted);margin-left:6px}
.tmp{color:var(--tmp)}.bpm{color:var(--bpm)}.spo2{color:var(--spo2)}
.tit{font-weight:600;margin-bottom:2px}
.ley{display:flex;gap:14px;font-size:.85rem;margin:2px 0 4px}
.ley i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.lab{flex:1;min-height:380px;display:flex;flex-direction:column;background:#fff;border:1px solid #9aa4ad;border-radius:8px;overflow:hidden;color:#222}
.lt{display:flex;gap:10px;align-items:baseline;padding:4px 8px;background:#eceff1;font-size:.8rem;color:#333}
.lt.sep{border-top:3px solid #c9d0d5}
.cv{position:relative;min-height:0}#cvE{flex:1}#cvB{flex:1}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.acc{display:flex;gap:8px}.acc button{flex:1}
.aviso{margin:0;min-height:0;color:var(--bad);font-size:.9rem}
@media (max-width:600px){
  body{padding-left:8px;padding-right:8px}
  .vals{gap:6px}.card{padding:6px 8px}
  .k{font-size:.68rem;line-height:1.2}
  .v{font-size:1.45rem}.v small{font-size:.75rem;margin-left:3px}
  .lab{min-height:420px}
}
</style>
</head>
<body>
<main>
  <div class="bar">
    <input id="ip" inputmode="decimal" placeholder="IP del ESP32" aria-label="IP del ESP32">
    <button id="conectar">Conectar</button>
  </div>
  <div class="estado"><span class="dot" id="dot"></span><span id="estado">Sin conexión</span></div>
  <p class="aviso" id="aviso"></p>

  <section class="pan" id="pA">
    <div class="vals">
      <div class="card"><div class="k">Frecuencia cardiaca (BPM)</div>
        <div class="v bpm"><span id="bpmA">--</span><small>lpm</small></div></div>
      <div class="card"><div class="k">Saturación de oxígeno (SpO2)</div>
        <div class="v spo2"><span id="spo2">--</span><small>%</small></div></div>
      <div class="card"><div class="k">Temperatura corporal</div>
        <div class="v tmp"><span id="temp">--</span><small>°C</small></div></div>
    </div>
    <div class="lab">
      <div class="lt"><span>mV</span><b>ECG</b></div>
      <div class="cv" id="cvE"><canvas id="ecg"></canvas></div>
      <div class="lt sep"><span>lpm</span><b>BPM por latido (R–R)</b></div>
      <div class="cv" id="cvB"><canvas id="bp"></canvas></div>
    </div>
  </section>


  <div class="acc">
    <button id="pausa">Pausar</button>
    <button id="csv">Descargar CSV</button>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
const FS=125, WIN=FS*6, HMAX=120, MV=3300/4095/1100;   // cuentas -> mV (ganancia 1100)
let base='', desde=0, ecg=[], bpmS=[], spo=[], bpmH=[], ultH=0, pausado=false, fallos=0, timer=null, log=[];

function estado(t,ok){$('estado').textContent=t;$('dot').classList.toggle('on',!!ok);}

const LC={'--grid':'#c5f3f7','--muted':'#333','--line':'#9aa4ad','--ecg':'#0b5a0b','--bpm':'#1a1a1a'};
function lienzo(id,der,pb0){
  const c=$(id), dpr=window.devicePixelRatio||1, w=c.clientWidth, h=c.clientHeight;
  if(!w||!h)return null;
  if(c.width!==Math.round(w*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);}
  const g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h); g.fillStyle='#fff'; g.fillRect(0,0,w,h);
  const css=getComputedStyle(document.documentElement), px=46, pr=der?46:10, py=8, pb=(pb0===undefined?24:pb0);
  return {g,w,h,col:n=>LC[n]||css.getPropertyValue(n).trim(),px,py,pw:w-px-pr,ph:h-py-pb};
}
function rejilla(L,total,paso,etq){
  const {g,px,py,pw,ph,h}=L;
  g.fillStyle='#eceff1'; g.fillRect(0,0,px,h);
  g.lineWidth=1; g.font='11px ui-monospace,Consolas,monospace'; g.textAlign='center';
  g.strokeStyle='#d9f7fa';
  for(let s=0;s<=total+1e-9;s+=0.2){
    const x=Math.round(px+pw-s/total*pw)+0.5;
    g.beginPath();g.moveTo(x,py);g.lineTo(x,py+ph);g.stroke();
  }
  for(let s=0;s<=total;s+=paso){
    const x=Math.round(px+pw-s/total*pw)+0.5;
    g.strokeStyle='#38dbe6'; g.beginPath();g.moveTo(x,py);g.lineTo(x,py+ph);g.stroke();
    if(etq){g.fillStyle='#333';g.fillText(s?'-'+s+' s':'0 s',Math.max(x,px+10),h-8);}
  }
  g.strokeStyle='#9aa4ad'; g.beginPath(); g.moveTo(px+0.5,py); g.lineTo(px+0.5,py+ph); g.stroke();
  g.textAlign='left';
}
function pasoNice(r,n){const q=r/n,p=Math.pow(10,Math.floor(Math.log10(q))),f=q/p;return (f<1.5?1:f<3?2:f<7?5:10)*p;}
function gridY(L,mn,mx,color){
  const {g,px,py,pw,ph}=L, st=pasoNice(mx-mn,4), dec=st>=1?0:(st>=0.1?1:2);
  g.font='11px ui-monospace,Consolas,monospace'; g.textAlign='right'; g.lineWidth=1;
  for(let v=Math.ceil(mn/st-1e-9)*st; v<=mx+1e-9; v+=st){
    const y=py+ph-(v-mn)/(mx-mn)*ph, cero=Math.abs(v)<st/2;
    g.strokeStyle=cero?'#7fe3ea':'#c5f3f7'; g.globalAlpha=1;
    g.beginPath();g.moveTo(px,y);g.lineTo(px+pw,y);g.stroke(); g.globalAlpha=1;
    g.fillStyle='#222'; g.fillText(v.toFixed(dec).replace('.',','),px-5,y+4);
  }
  g.textAlign='left';
}
let rE=null,rB=null;
function suave(r,mn,mx){
  if(!r)return {mn,mx};
  r.mn=mn<r.mn?mn:r.mn+0.06*(mn-r.mn);
  r.mx=mx>r.mx?mx:r.mx+0.06*(mx-r.mx);
  return r;
}
function ejeY(L,mn,mx,der,color,dec,unidad){
  const {g,px,py,pw,ph}=L;
  g.fillStyle=color; g.font='11px ui-monospace,Consolas,monospace';
  g.textAlign=der?'left':'right';
  for(let t=0;t<=4;t++){
    const v=mx-(mx-mn)*t/4;
    g.fillText(v.toFixed(dec),der?px+pw+4:px-4,py+ph*t/4+4);
  }
  g.textAlign='left';
}
function linea(L,arr,mn,mx,total,color,ancho){
  const {g,px,py,pw,ph}=L, n=arr.length;
  g.strokeStyle=color; g.lineWidth=ancho; g.lineJoin='round'; g.beginPath();
  let ab=false;
  arr.forEach((v,i)=>{
    if(v===null){ab=false;return;}
    const x=px+pw-(n-1-i)*pw/(total-1), y=py+ph-(v-mn)/(mx-mn)*ph;
    ab?g.lineTo(x,y):g.moveTo(x,y); ab=true;
  });
  g.stroke();
}
function escalon(L,arr,mn,mx,total,color,ancho){
  const {g,px,py,pw,ph}=L, n=arr.length;
  g.strokeStyle=color; g.lineWidth=ancho; g.lineJoin='miter'; g.lineCap='butt'; g.beginPath();
  let ab=false, yp=0;
  arr.forEach((v,i)=>{
    if(v===null){ab=false;return;}
    const x=px+pw-(n-1-i)*pw/(total-1), y=py+ph-(v-mn)/(mx-mn)*ph;
    if(!ab){g.moveTo(x,y);ab=true;}
    else{g.lineTo(x,yp);g.lineTo(x,y);}
    yp=y;
  });
  g.stroke();
}
function vacio(L,t){L.g.fillStyle=L.col('--muted');L.g.font='13px system-ui,sans-serif';L.g.fillText(t,L.px+10,L.h/2);}

function dibujarECG(){
  const L=lienzo('ecg',false,4); if(!L)return;
  rejilla(L,6,1,false);
  if(ecg.length<2){vacio(L,'Esperando señal ECG...');return;}
  const m=ecg.map(v=>v*MV);
  let mn=Math.min(...m), mx=Math.max(...m);
  if(mx-mn<0.3){const c=(mx+mn)/2;mn=c-0.15;mx=c+0.15;}
  const d=(mx-mn)*0.12; mn-=d; mx+=d;
  rE=suave(rE,mn,mx); mn=rE.mn; mx=rE.mx;
  gridY(L,mn,mx,L.col('--ecg'));
  L.g.save(); L.g.beginPath(); L.g.rect(L.px,L.py,L.pw,L.ph); L.g.clip();
  linea(L,m,mn,mx,WIN,'#0b5a0b',1.1);
  L.g.restore();
}
function dibujarBPM(){
  const L=lienzo('bp',false); if(!L)return;
  rejilla(L,6,1,true);
  const b=bpmS.filter(v=>v!==null);
  if(!b.length){vacio(L,'Esperando latidos...');return;}
  let mn=Math.min(...b), mx=Math.max(...b);
  if(mx-mn<8){const c=(mx+mn)/2;mn=c-4;mx=c+4;}
  const d=(mx-mn)*0.2; mn-=d; mx+=d;
  rB=suave(rB,mn,mx); mn=rB.mn; mx=rB.mx;
  gridY(L,mn,mx,L.col('--bpm'));
  L.g.save(); L.g.beginPath(); L.g.rect(L.px,L.py,L.pw,L.ph); L.g.clip();
  escalon(L,bpmS,mn,mx,WIN,'#1a1a1a',1.3);
  L.g.restore();
}
function dibujar(){dibujarECG();dibujarBPM();}

function mostrar(d){
  const b=d.bpm>0?Math.round(d.bpm):'--', s=d.spo2>0?d.spo2:'--';
  $('bpmA').textContent=b; $('temp').textContent=d.temp>0?d.temp.toFixed(1):'--'; $('spo2').textContent=s;
  $('aviso').textContent=d.lo?'ECG: conecta los electrodos':(d.spo2>0?'':'SpO2: coloca el dedo en el sensor');
  const t=Date.now();
  if(t-ultH>=1000){
    ultH=t;
    spo.push(d.spo2>0?d.spo2:null); bpmH.push(d.bpm>0?d.bpm:null);
    if(spo.length>HMAX){spo.shift();bpmH.shift();}
    log.push([new Date(t).toISOString(),d.bpm>0?d.bpm.toFixed(1):'',d.spo2>0?d.spo2:'']);
  }
  estado('Conectado',true); dibujar();
}

async function leer(){
  if(pausado)return;
  const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),1500);
  try{
    const d=await (await fetch(base+'/datos?desde='+desde,{signal:ctl.signal,cache:'no-store'})).json();
    fallos=0;
    if(d.seq<desde||d.s0!==desde){ecg=[];bpmS=[];}
    for(const v of d.d){ecg.push(v);bpmS.push(d.bpm>0?d.bpm:null);}
    if(ecg.length>WIN){ecg.splice(0,ecg.length-WIN);bpmS.splice(0,bpmS.length-WIN);}
    desde=d.seq; mostrar(d);
  }catch(e){
    if(++fallos>=3)estado('Sin respuesta del ESP32. Revisa el WiFi y la IP.',false);
  }finally{clearTimeout(to);}
}

function arrancar(){
  desde=0; ecg=[]; spo=[]; bpmH=[]; bpmS=[]; log=[]; rE=null; rB=null; fallos=0;
  estado('Conectando...',false); clearInterval(timer); leer(); timer=setInterval(leer,150);
}
function conectar(){
  const ip=$('ip').value.trim().replace(/^https?:\/\//,'').replace(/\/+$/,'');
  if(!ip){estado('Escribe la IP del ESP32',false);return;}
  try{localStorage.setItem('ecg_ip',ip);}catch(e){}
  base='http://'+ip; arrancar();
}
$('conectar').onclick=conectar;
$('ip').addEventListener('keydown',e=>{if(e.key==='Enter')conectar();});
$('pausa').onclick=()=>{pausado=!pausado;$('pausa').textContent=pausado?'Reanudar':'Pausar';};
$('csv').onclick=()=>{
  if(!log.length)return;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['hora,bpm,spo2\n'+log.map(r=>r.join(',')).join('\n')],{type:'text/csv'}));
  a.download='ecg_spo2_'+Date.now()+'.csv'; a.click(); URL.revokeObjectURL(a.href);
};
window.addEventListener('resize',dibujar);

const emb=/^\d+\.\d+\.\d+\.\d+/.test(location.host);   // abierta desde el propio ESP32
if(emb){document.querySelector('.bar').style.display='none'; base=''; dibujar(); arrancar();}
else{
  let g=''; try{g=localStorage.getItem('ecg_ip')||'';}catch(e){}
  $('ip').value=g||'192.168.4.1'; dibujar(); conectar();
}
</script>
